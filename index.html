<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Product Card</title>
</head>
<body>
  <h1 id="page-title">Выбери свой продукт</h1>
    <div class="buttons-container">
    <button id="change-color-btn">Покрасить</button>
    <button id="change-color-all-btn">Покрасить все</button>
    <button id="open-google-first">Открыть Google 1ый способ</button>
    <button id="open-google-second">Открыть Google 2ой способ</button>
    <button id="console-output-btn">Alert и Консоль</button>
    <button id="change-self-color-btn" class="change-self-color-btn">Сменить цвет кнопки</button>
  </div>
  
  <div class="cards-container">
    <ul class="product-card-list"></ul>
    <template id="product-card-template">
      <div class="product-card">
        <div class="bg-image-block"></div>
        <div class="img-div">
          <img class="img-bottle" src="">
        </div>
        <div class="text-div">
          <p class="transparent"></p>
          <h2></h2>
          <span class="description"></span>
          <span class="content"></span>
          <ul>
            <li class="list-item"></li>
            <li class="list-item"></li>
            <li class="list-item"></li>
          </ul>

          <div class="price-info">
            <span class="price"></span>
            <span class="price-tag"></span>
          </div>

        </div>
      </div>
    </template>
  </div>
  <script src="main.js"></script>
  <script src="homework-8.js" type="module"></script>
  <script src="product-cards.js" type="module"></script>
</body>
</html>
