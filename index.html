<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Product Card</title>
</head>
<body>
  <h1 id="page-title">Выбери свой продукт</h1>
    <div class="buttons-container">
    <button id="change-color-btn">Покрасить</button>
    <button id="change-color-all-btn">Покрасить все</button>
    <button id="open-google-first">Открыть Google 1ый способ</button>
    <button id="open-google-second">Открыть Google 2ой способ</button>
    <button id="console-output-btn">Alert и Консоль</button>
    <button id="change-self-color-btn" class="change-self-color-btn">Сменить цвет кнопки</button>
  </div>
  
  <div class="cards-container">
    <ul class="product-card-list"></ul>
    <template id="product-card-template">
      <div class="product-card">
        <div class="bg-image-block"></div>
        <div class="img-div">
          <img class="img-bottle" src="">
        </div>
        <div class="text-div">
          <p class="transparent">ДЛЯ НОРМАЛЬНОЙ КОЖИ</p>
          <h2></h2>
          <span class="description"></span>
          <span class="content">Состав:</span>
          <ul class="items-list-ul"></ul>

          <div class="price-info">
            <span class="price">Цена</span>
            <span class="price-tag"></span>
          </div>

        </div>
      </div>
    </template>
  </div>

  <footer>
    <div class="footer-container">

      <div class="text-block">
        <h3>Product Cards</h3>
        <p>У нас самые лучшие продукты для кожи!</p>
        <div class="icons-container">
          <img class="icon1" src="images/telegram-icon.svg">
          <img class="icon2" src="images/vk-icon.svg">
        </div>
      </div>
      
      <div class="auth-register-block">

        <form id="email-form">
          <div class="input-block">
            <label for="email">Подпишись на наши акции:</label>
            <div class="submit-block">
              <input name="email" type="email" placeholder="Введи Email..." id="input-email" required>
              <div class="divider"></div>
              <button type="submit" id="email-submit">Подписаться</button>
            </div>
          </div>
        </form>

        <div class="register-block">
          <button type="button" class="register-button">Регистрация</button>
        </div>

        <div role="button" class="modal" id="modal">
          <form id="modal-form">
            <div class="close-cross"></div>
            <p class="form-label">Зарегистрируйтесь</p>
            <div class="modal-inputs-block">
              <div id="block-user-name" class="form-group">
                <label for="user-name">Ваше Имя</label>
                <input id="user-name" minlength="3" placeholder="Ваше Имя"
                name="user-name" type="text" required class="input-user-name">
              </div>

              <div id="block-user-surname" class="form-group">
                <label for="user-surname">Ваша Фамилия</label>
                <input id="user-surname" minlength="3" placeholder="Ваша Фамилия"
                name="user-surname" type="text" required class="input-user-surname">
              </div>

              <div id="block-user-date" class="form-group">
                <label for="user-date">Дата рождения</label>
                <input id="user-date" name="userDate" type="date" required class="input-user-date">
              </div>

              <div id="block-user-login" class="form-group">
                <label for="user-login">Логин</label>
                <input id="user-login" minlength="5" placeholder="Логин"
                name="user-login" type="text" required class="input-user-login">
              </div>

              <div id="block-user-pwd" class="form-group">
                <label for="user-pwd">Пароль</label>
                <input id="user-pwd" minlength="6" placeholder="Пароль"
                name="user-pwd" type="password" required class="input-user-pwd">
              </div>

              <div id="block-user-pwd-repeat" class="form-group">
                <label for="user-pwd-repeat">Повторите пароль</label>
                <input id="user-pwd-repeat" minlength="6" placeholder="Повторите пароль"
                name="user-pwd-repeat" type="password" required class="input-user-pwd-repeat">
              </div>
            </div>
            <button class="modal-form-button" type="submit">Отправить</button>
          </form>
        </div>
      </div>

      <div class="nav-block">
        <label for="nav-ul" class="nav-label">Быстрые ссылки</label>
        <ul class="nav-ul">
          <li class="nav-link">
            <a>Главная</a>
          </li>
          <li class="nav-link">
            <a>Магазин</a>
          </li>
          <li class="nav-link">
            <a>Контакты</a>
          </li>
        </ul>
      </div>
    </div>
    <div class="lower-text">
      <hr>
      <p>www.product-cards.com©all right reserve</p>
    </div>
  </footer>


  <script src="main.js" type="module"></script>
</body>
</html>
